<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0B1220" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Stopwatch" />
        <title>Stopwatch</title>
        <link rel="manifest" href="/public/apps/stopwatch/manifest.webmanifest" />
        <link rel="icon" href="/public/apps/sync/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/public/apps/stopwatch/stopwatch.css" />
    </head>
    <body>
        <script type="module" src="/public/apps/sync/syncbar.js"></script>

        <div id="app">
            <div class="topbar">
                <h1 id="page-title">Stopwatch</h1>
                <div class="status-dot" id="status-dot"></div>
            </div>

            <main>
                <!-- CLOCK TAB -->
                <section id="tab-clock" class="tab-panel active">
                    <div class="timer-display">
                        <div id="total-time" class="total-time">0:00.0</div>
                        <div class="lane-rule"></div>
                    </div>

                    <div class="clock-state" id="clock-idle">
                        <button id="start-btn" class="btn-primary full-width">Start</button>
                    </div>

                    <div class="clock-state" id="clock-run" hidden>
                        <div class="laps-section">
                            <div class="laps-header">
                                <span>#</span><span>Min/km</span><span>Lap</span><span>Total</span>
                            </div>
                            <ul id="laps-list" class="laps-list"></ul>
                        </div>

                        <div class="controls" id="controls-running">
                            <button id="lap-btn" class="btn-outline">Lap</button>
                            <button id="stop-btn" class="btn-danger">Stop</button>
                        </div>
                        <div class="controls" id="controls-stopped" hidden>
                            <button id="reset-btn" class="btn-primary">Reset</button>
                        </div>
                    </div>

                    <details class="settings-panel" id="settings-panel">
                        <summary>Settings</summary>
                        <div class="settings-body">
                            <div class="setting-group">
                                <label class="setting-label" for="lap-distance-input">Lap distance (m)</label>
                                <div class="setting-input-row">
                                    <input
                                        type="number"
                                        id="lap-distance-input"
                                        inputmode="numeric"
                                        min="1"
                                        step="1"
                                        value="1000"
                                    />
                                </div>
                            </div>
                        </div>
                    </details>
                </section>

                <!-- RUNS TAB -->
                <section id="tab-runs" class="tab-panel">
                    <div class="empty-state" id="runs-empty" hidden>
                        No runs yet.<br />Start your first one from the Stopwatch tab.
                    </div>
                    <ul class="runs-list" id="runs-list"></ul>
                </section>
            </main>

            <nav class="tabbar">
                <button class="tab-btn active" data-tab="clock">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="13" r="8" />
                        <path d="M12 9v4l3 2" />
                        <path d="M9 2h6" />
                        <path d="M18 5l1.5-1.5" />
                    </svg>
                    Stopwatch
                </button>
                <button class="tab-btn" data-tab="runs">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M4 6h16" />
                        <path d="M4 12h10" />
                        <path d="M4 18h13" />
                        <circle cx="20" cy="12" r="1.5" />
                    </svg>
                    Runs
                </button>
            </nav>
        </div>

        <script type="module" src="/public/apps/stopwatch/stopwatch.js"></script>
    </body>
</html>
